# A fresh install explains what to do on every tab, and the call to action works.
appId: com.vincicent.bodytrack
---
- launchApp:
    clearState: true
- assertVisible: 'No entries yet'
- assertVisible: 'Add your first weight'
- tapOn: 'Weight(, tab.*)?' # the tab: "Weight", which iOS reads as "Weight, tab, 2 of 5" (not "Current weight")
- assertVisible: 'No entries yet'
- tapOn: '.*Measurements.*' # tab: iOS reads it as "Measurements, tab, n of 4"
- assertVisible: 'No measurements yet'
- tapOn: '.*Dashboard.*' # tab: iOS reads it as "Dashboard, tab, n of 4"
- tapOn: 'Add your first weight'
- assertVisible: 'Add weight' # the form opens
