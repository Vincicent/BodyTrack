# lb shows lb, and switching back shows exactly the same value: the stored kg never change.
appId: com.vincicent.bodytrack
---
- launchApp:
    clearState: true
- runFlow:
    file: subflows/add-first-weight.yaml
    env:
      WEIGHT: '80'
- tapOn: '.*Settings.*' # tab: iOS reads it as "Settings, tab, n of 4"
- tapOn: 'lb'
- tapOn: '.*Dashboard.*' # tab: iOS reads it as "Dashboard, tab, n of 4"
- assertVisible: '176.4 lb'
- tapOn: '.*Settings.*' # tab: iOS reads it as "Settings, tab, n of 4"
- tapOn: 'kg'
- tapOn: '.*Dashboard.*' # tab: iOS reads it as "Dashboard, tab, n of 4"
- assertVisible: '80.0 kg' # back to exactly 80
