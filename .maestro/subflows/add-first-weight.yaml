# Adds the first weight from the empty dashboard. Usage:
#   - runFlow: { file: subflows/add-first-weight.yaml, env: { WEIGHT: "80" } }
appId: com.vincicent.bodytrack
---
- tapOn: 'Add your first weight'
- tapOn:
    id: 'weight-input' # the input, not its label
- inputText: ${WEIGHT}
- runFlow:
    file: tap-below-keyboard.yaml
    env:
      BUTTON: 'Save'
