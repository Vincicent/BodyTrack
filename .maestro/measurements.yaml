# Several body sites saved at once, each shown in the list.
appId: com.vincicent.bodytrack
---
- launchApp:
    clearState: true
- tapOn: '.*Measurements.*' # tab: iOS reads it as "Measurements, tab, n of 4"
- assertVisible: 'No measurements yet'
- tapOn:
    text: 'Add measurements'
    index: 1 # the empty state's button (index 0 is the "+" in the header: it works too)
# The label and its input share the same name ("Waist"), so target the input by its testID. Top to bottom, and wait
# for the form to stop moving (the keyboard controller scrolls the focused field into view): no fixed sleeps.
- tapOn:
    id: 'measurement-neck'
- inputText: '38'
- waitForAnimationToEnd
# Waist is 2 fields below: go there with the toolbar's ↓, like a user (on a small screen the keyboard covers it).
# Optional, then tap Waist: without an on-screen keyboard there's no toolbar, but nothing covers Waist either.
- tapOn:
    id: 'keyboard.toolbar.next'
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: 'keyboard.toolbar.next'
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: 'measurement-waist'
- inputText: '82'
- waitForAnimationToEnd
# 9 sites: Save is below the screen, like for a user
- runFlow:
    file: subflows/tap-below-keyboard.yaml
    env:
      BUTTON: 'Save'
# The rows sit under the body map: on a small screen they're below the fold, so scroll to them like a user
# (the map's own labels read "Waist, 82.0 cm", without the list's ". ": no mix-up)
- scrollUntilVisible:
    element: 'Neck, 38.0 cm. '
- scrollUntilVisible:
    element: 'Waist, 82.0 cm. '
