# A wrong entry can be opened, corrected (Edit), then deleted from its details.
appId: com.vincicent.bodytrack
---
- launchApp:
    clearState: true
- runFlow:
    file: subflows/add-first-weight.yaml
    env:
      WEIGHT: '80'
- tapOn: 'Weight(, tab.*)?' # the tab: "Weight", which iOS reads as "Weight, tab, 2 of 5" (not "Current weight")
- tapOn: '.*80.0 kg.*' # the row → its details
- assertVisible: 'Weight entry'
- tapOn: 'Edit' # the header button
- assertVisible: 'Edit weight'
# On a slow CI simulator, typing can drop a character (GitHub saved "7" instead of "79"): retype until the field holds 79
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: 'weight-input' # the input, not its label
      - eraseText
      - inputText: '79'
      - assertVisible:
          id: 'weight-input'
          text: '79'
- runFlow:
    file: subflows/tap-below-keyboard.yaml
    env:
      BUTTON: 'Save changes'
- extendedWaitUntil: # back on the details, updated (slow CI simulators: give it time)
    visible: '79.0 kg'
    timeout: 15000
- tapOn: 'Delete entry'
- assertVisible: 'Delete this entry?'
- tapOn: '(?i)delete' # the dialog's button (Android shows it in capitals)
- assertVisible: 'No entries yet'
