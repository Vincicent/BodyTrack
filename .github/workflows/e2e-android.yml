# (free alternative to EAS Workflows, whose Maestro jobs need a paid plan): build a release APK, start
# an Android emulator on GitHub's machine, and run the Maestro flows (.maestro/) on every pull request to main.
name: E2E Android
on:
  pull_request:
    branches: [main]
  workflow_dispatch: # also runnable by hand: Actions tab → E2E Android → Run workflow
concurrency:
  group: e2e-android-${{ github.ref }}
  cancel-in-progress: true # a new push to the PR cancels the run still going
jobs:
  maestro:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4 # caches Gradle between runs
      - run: npm ci

      # Release build: the JavaScript is inside the APK (no Metro). android/ is generated, as on your Mac. Prebuild signs
      # release builds with the debug key, so no secret is needed. x86_64 only: the emulator's processor type.
      - run: npx expo prebuild --platform android --no-install
      # No lint here: it's for store builds (EAS), it doubles the build time and runs out of memory on GitHub's machine
      - run: ./gradlew assembleRelease -x lintVitalAnalyzeRelease -x lintVitalRelease -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
        working-directory: android
        env: { ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64 }

      # The build's Gradle daemon keeps up to 4 GB of memory after the build: free it for the emulator
      - run: ./gradlew --stop
        working-directory: android

      # Pinned: a new Maestro release can't break CI without a change here (2.11.0 is the version tested locally)
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
        env: { MAESTRO_VERSION: 2.11.0 }

      # The emulator needs hardware acceleration (KVM), available on GitHub's Linux machines once allowed
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Boot the emulator ONCE, save it (a snapshot), and reuse it on later runs: the flows start on an emulator that has
      # finished its first-boot work. Twice, a freshly booted one lost its adb connection ("device offline") as the first
      # flow started. Change the key's last part (v1 → v2) to force a new emulator after changing the settings below.
      - name: Emulator cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-35-default-x86_64-v1

      - name: Create the emulator and its snapshot (first run only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          # "default" = plain Android, without Google services: their first-boot work is what overloaded the emulator,
          # and BodyTrack doesn't need them. (Not "aosp_atd": it removes the system UI the flows use.)
          target: default
          arch: x86_64
          cores: 3 # GitHub's machine has 4: leave one for Maestro and adb
          ram-size: 4096M
          force-avd-creation: false # reuse the cached emulator
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Emulator snapshot created"

      - name: Run the flows on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env: { MAESTRO_CLI_NO_ANALYTICS: 1 }
        with:
          # Same emulator as the step above (GitHub Actions can't share these lines between steps)
          api-level: 35
          target: default
          arch: x86_64
          cores: 3
          ram-size: 4096M
          force-avd-creation: false
          # Starts from the snapshot, and doesn't overwrite it when done
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disable-spellchecker: true # no red underlines or suggestions while Maestro types
          # Each line runs as its own command. Open the app once (-W waits until it's drawn: the first launch of a release
          # build is the slowest), check adb sees the device, and if the run fails anyway, run the flows once more.
          script: |
            adb install android/app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n com.vincicent.bodytrack/.MainActivity
            adb shell am force-stop com.vincicent.bodytrack
            adb wait-for-device
            maestro test .maestro/ --format junit --output maestro-report.xml || (sleep 20 && adb wait-for-device && maestro test .maestro/ --format junit --output maestro-report.xml)

      # Maestro keeps them in ~/.maestro, a hidden folder (invisible in Finder once unzipped): copy them somewhere visible
      - name: Keep screenshots and logs of a failed flow
        if: failure()
        run: cp -R ~/.maestro/tests maestro-results || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug
          path: |
            maestro-results/
            maestro-report.xml
